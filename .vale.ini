# .vale.ini — prose linting for agent-kb
#
# Style: ONE comprehensive guide (Microsoft) + alex + Vale's built-in rules.
# Do not add Google as a second comprehensive style: the two disagree about
# contractions, headings and the Oxford comma, their rules overlap without
# de-duplication, and every span gets reported twice.
#
# Analysis behind this config: .pi/research/vale-style-research.md
#
# Every rule switched off below is one this corpus violates on purpose.

StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = akb

Packages = Microsoft, alex

# Escaped, not read as prose: inline code, UI spans, and the YAML front matter
# every KB page carries. NOTE: this key REPLACES the default list
# (tt, code, kbd, samp) — they must be repeated. Vale has linted front-matter
# string fields since 3.11; `frontmatter` suppresses the whole block.
IgnoredScopes = tt, code, kbd, samp, frontmatter

[*.md]
BasedOnStyles = Vale, Microsoft, alex

# agent-kb syntax that reaches Vale as prose: wikilinks (bare and
# explicit-destination forms) and provenance markers. Stripped pre-rule.
TokenIgnores = (\[\[[^\]]+\]\](?:\([^)]*\))?), \
               (\^\[(?:inferred|ambiguous|extracted)\])

# ---- Microsoft rules this corpus rejects -----------------------------------
# ADRs and status notes say "we", and record decisions that were made.
Microsoft.FirstPerson = NO
Microsoft.We          = NO
Microsoft.Passive     = NO
# Technical prose states things in full; contractions are a preference.
Microsoft.Contractions = NO
# Punctuation/format preferences rather than clarity problems.
Microsoft.OxfordComma    = NO
Microsoft.Semicolon      = NO
Microsoft.SentenceLength = NO
# Heading style: keep reported, but never above suggestion.
Microsoft.Headings = suggestion
# Noise-prone formatting rules.
Microsoft.AMPM     = NO
Microsoft.Ellipses = NO
Microsoft.Foreign  = NO
Microsoft.Vocab    = NO
# House style is the SPACED em dash (" — "); Microsoft mandates the closed
# form. 2,223 corpus hits = the corpus's own consistent convention wins.
Microsoft.Dashes = NO

# ---- alex: keep the substitutions, drop the profanity triage ---------------
# ProfanityMaybe/Unlikely match ordinary engineering words and numbers.
alex.ProfanityMaybe    = NO
alex.ProfanityUnlikely = NO
