name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Version lockstep
        run: scripts/check-version-lockstep.sh

      # The test suite is identity-hermetic: the testscript Setup injects an
      # ambient GIT_CONFIG_* identity, so no host git configuration is needed.
      - name: Unit and integration tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Lint
        # golangci-lint-action v8
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # yamllint disable-line rule:line-length
        with:
          # Keep in step with the devShell's golangci-lint (flake.nix)
          version: v2.11
