name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Version lockstep
        run: scripts/check-version-lockstep.sh

      # The test suite is identity-hermetic: the testscript Setup injects an
      # ambient GIT_CONFIG_* identity, so no host git configuration is needed.
      - name: Unit and integration tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Lint
        # golangci-lint-action v8
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9  # yamllint disable-line rule:line-length
        with:
          # Keep in step with the devShell's golangci-lint (flake.nix)
          version: v2.11
