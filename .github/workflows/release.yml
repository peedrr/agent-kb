name: release

# Triggered by pushing a v* tag (created locally by `just release`, which runs
# the precondition and version-lockstep guards first). The tag is the release:
# this workflow tests the tagged commit, cross-compiles the binaries, and
# creates the GitHub Release with the CHANGELOG section as its notes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # No cache: this workflow publishes artifacts (cache-poisoning)
          cache: false

      # The test suite is identity-hermetic: the testscript Setup injects an
      # ambient GIT_CONFIG_* identity, so no host git configuration is needed.
      - name: Unit and integration tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches supportedSystems in flake.nix (no Windows: Nix does not
        # target it, and the test suite is only exercised on unix).
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # No cache: this workflow publishes artifacts (cache-poisoning)
          cache: false

      # Package in this job, not in publish: the artifact round-trip is
      # zip-based and drops the executable bit, while tar preserves it.
      - name: Build and package
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="dist/akb_${version}_${GOOS}_${GOARCH}"
          mkdir -p "$out"
          ldflags="-X main.version=${version} -X main.commit=${GITHUB_SHA:0:7}"
          go build -ldflags "$ldflags" \
            -o "$out/akb" ./cmd/akb/
          cp LICENSE README.md "$out/"
          tar -czf "dist/akb_${version}_${GOOS}_${GOARCH}.tar.gz" \
            -C dist "$(basename "$out")"

      # upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # yamllint disable-line rule:line-length
        with:
          name: akb_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Write scope lives here only; test/build inherit the read-only default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # yamllint disable-line rule:line-length
        with:
          pattern: akb_*
          path: dist/
          merge-multiple: true

      - name: Checksum
        run: |
          cd dist
          sha256sum akb_*.tar.gz > checksums.txt

      - name: Extract changelog section as release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "error: no CHANGELOG section for [$version]" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "akb $GITHUB_REF_NAME"
          --notes-file notes.md
          dist/akb_*.tar.gz dist/checksums.txt
